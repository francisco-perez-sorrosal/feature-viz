[project]
name = "feature-viz"
version = "0.1.0"
description = "Educational reimplementation of Distill Circuits (zoom-in / early-vision / visualizing-weights) on InceptionV1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.23",
    "matplotlib>=3.6",
    "Pillow>=9.4",
    "marimo>=0.10",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feature_viz"]
